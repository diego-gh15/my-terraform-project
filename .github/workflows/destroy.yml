name: "Terraform Destroy"

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  id-token: write # Obligatorio para solicitar el token OIDC
  contents: read  # Obligatorio para clonar el repositorio

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS Credentials (CD Role)
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-cd-role
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init -lockfile=readonly

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_my_public_ip: ${{ vars.MY_PUBLIC_IP }}